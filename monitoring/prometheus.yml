global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Load Balancer
  - job_name: 'load-balancer'
    static_configs:
      - targets: ['load-balancer:3004']
    metrics_path: '/metrics'
  
  # API Gateway
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']
    metrics_path: '/metrics'
  
  # Service Discovery
  - job_name: 'service-discovery'
    static_configs:
      - targets: ['service-discovery:3006']
    metrics_path: '/metrics'
  
  # Orchestrator
  - job_name: 'orchestrator'
    static_configs:
      - targets: ['orchestrator:3003']
    metrics_path: '/metrics'
  
  # Billing
  - job_name: 'billing'
    static_configs:
      - targets: ['billing:3007']
    metrics_path: '/metrics'
  
  # Auth Service
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:3002']
    metrics_path: '/metrics'